[workspace]
authors = ["Leandro Peralta <leandro.peralta@gethomesafe.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "ambler-mojo"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
counter = "mojo run -I . walks/counter.mojo"
chat = "mojo run -I . walks/chat.mojo"
test = '''sh -c 'for f in nodes/tests/test_*.mojo; do mojo run -I . "$f" || exit 1; done' '''

[dependencies]
mojo = ">=1.1.0,<2"
python = ">=3.13,<3.14"
